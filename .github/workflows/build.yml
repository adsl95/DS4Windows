name: Build DS4Windows (.NET 8)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Auto-Find and Publish DS4Windows
      run: |
        $proj = Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.Name -like "*WPF*" -or $_.Name -like "*DS4Windows*" } | Select-Object -First 1
        if (-not $proj) {
            $proj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
        }
        if ($proj) {
            Write-Host "Found project file: $($proj.FullName)"
            dotnet publish $proj.FullName -c Release -r win-x64 --self-contained false -o ./publish
        } else {
            Write-Error "No .csproj file found in repository!"
            exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DS4Windows-Fixed-Release
        path: ./publish/