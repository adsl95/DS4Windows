name: Build DS4Windows (.NET 8)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Patch Source Code for .NET 8 AssemblyLoadContext Compatibility
      run: |
        Write-Host "Patching AppDomain.CurrentDomain.AssemblyResolve for .NET 8 ALC Default Context..."
        $csFiles = Get-ChildItem -Recurse -Filter "*.cs"
        foreach ($file in $csFiles) {
            $content = Get-Content $file.FullName -Raw -Encoding UTF8
            if ($content -match "AssemblyResolve" -or $content -match "Assembly\.LoadFile" -or $content -match "Assembly\.LoadFrom") {
                Write-Host "Found target C# file: $($file.FullName)"
                
                # 將 Assembly.LoadFile / LoadFrom 替換為 .NET 8 的 AssemblyLoadContext.Default.LoadFromAssemblyPath
                $patched = [regex]::Replace($content, 'Assembly\.LoadFile\s*\(([^)]+)\)', 'System.Runtime.Loader.AssemblyLoadContext.Default.LoadFromAssemblyPath(System.IO.Path.GetFullPath($1))')
                $patched = [regex]::Replace($patched, 'Assembly\.LoadFrom\s*\(([^)]+)\)', 'System.Runtime.Loader.AssemblyLoadContext.Default.LoadFromAssemblyPath(System.IO.Path.GetFullPath($1))')
                
                [System.IO.File]::WriteAllText($file.FullName, $patched, [System.Text.Encoding]::UTF8)
            }
        }

    - name: Restore NuGet Packages
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        if ($sln) {
            Write-Host "Restoring solution via NuGet: $($sln.FullName)"
            nuget restore $sln.FullName
        } else {
            nuget restore
        }

    - name: Build Solution with MSBuild (x64)
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        if ($sln) {
            Write-Host "Building solution: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform="x64"
        } else {
            $proj = Get-ChildItem -Recurse -Filter DS4WinWPF.csproj | Select-Object -First 1
            msbuild $proj.FullName /p:Configuration=Release /p:Platform="x64"
        }

    - name: Collect Output Files and Enforce Lang Directory Structure
      run: |
        # 1. 清理與建立 publish/Lang 資料夾
        if (Test-Path ./publish) { Remove-Item ./publish -Recurse -Force }
        New-Item -ItemType Directory -Force -Path ./publish/Lang | Out-Null

        # 2. 尋找 DS4Windows.exe 的編譯輸出目錄
        $exe = Get-ChildItem -Recurse -Filter "DS4Windows.exe" | Where-Object { $_.FullName -like "*bin*Release*" -or $_.FullName -like "*bin*x64*" } | Select-Object -First 1
        if (-not $exe) {
            Write-Error "DS4Windows.exe not found after build!"
            exit 1
        }
        $dir = $exe.DirectoryName
        Write-Host "Found build output at: $dir"

        # 3. 複製編譯產物，並修正 robocopy 傳回碼 (1-7 為正常複製成功)
        robocopy "$dir" ./publish /E /NJH /NJS /NDL /NC /NS
        if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 }

        # 4. 掃描根目錄下的所有語系資料夾，移動至 publish/Lang/
        $cultureDirs = Get-ChildItem -Path ./publish -Directory | Where-Object {
            $_.Name -ne "Lang" -and (
                (Get-ChildItem -Path $_.FullName -Filter "*.resources.dll" -Recurse).Count -gt 0 -or
                $_.Name -match "^[a-zA-Z]{2,3}(-[a-zA-Z]{2,4})?$"
            )
        }

        foreach ($cDir in $cultureDirs) {
            $targetLangDir = "./publish/Lang/$($cDir.Name)"
            Write-Host "Moving culture '$($cDir.Name)' into '$targetLangDir'..."
            if (-not (Test-Path $targetLangDir)) {
                New-Item -ItemType Directory -Force -Path $targetLangDir | Out-Null
            }
            Copy-Item -Path "$($cDir.FullName)\*" -Destination $targetLangDir -Recurse -Force
            Remove-Item -Path $cDir.FullName -Recurse -Force
        }

        # 5. 在 Lang/ 內建立 .NET 8 語系雙向別名，防止 CultureInfo 找不到目錄
        if (Test-Path ./publish/Lang/zh-TW) {
            Copy-Item -Path ./publish/Lang/zh-TW -Destination ./publish/Lang/zh-Hant -Recurse -Force
        }
        if (Test-Path ./publish/Lang/zh-Hant) {
            Copy-Item -Path ./publish/Lang/zh-Hant -Destination ./publish/Lang/zh-TW -Recurse -Force
        }
        if (Test-Path ./publish/Lang/zh-CN) {
            Copy-Item -Path ./publish/Lang/zh-CN -Destination ./publish/Lang/zh-Hans -Recurse -Force
        }
        if (Test-Path ./publish/Lang/zh-Hans) {
            Copy-Item -Path ./publish/Lang/zh-Hans -Destination ./publish/Lang/zh-CN -Recurse -Force
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DS4Windows-x64-Release
        path: ./publish/