name: Build DS4Windows (.NET 8)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Inject LangResolver ModuleInitializer for .NET 8
      run: |
        Write-Host "Searching for main WPF project file..."
        $proj = Get-ChildItem -Recurse -Filter "DS4WinWPF.csproj" | Select-Object -First 1
        if (-not $proj) {
            $proj = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.Name -like "*WPF*" -or $_.Name -like "*DS4*" } | Select-Object -First 1
        }
        
        $projDir = $proj.DirectoryName
        $resolverPath = Join-Path $projDir "LangResolver.cs"
        Write-Host "Injecting LangResolver.cs into: $resolverPath"

        # 寫入可以在 CLR 啟動最早期運行的 LangResolver.cs
        @'
        using System;
        using System.IO;
        using System.Reflection;
        using System.Runtime.CompilerServices;
        using System.Runtime.Loader;

        namespace DS4WinWPF
        {
            internal static class LangResolver
            {
                [ModuleInitializer]
                internal static void Initialize()
                {
                    try
                    {
                        AssemblyLoadContext.Default.Resolving += (context, assemblyName) =>
                        {
                            if (assemblyName.Name.EndsWith(".resources", StringComparison.OrdinalIgnoreCase))
                            {
                                return ResolveSatelliteAssembly(assemblyName.Name, assemblyName.CultureName, path => context.LoadFromAssemblyPath(path));
                            }
                            return null;
                        };

                        AppDomain.CurrentDomain.AssemblyResolve += (sender, args) =>
                        {
                            var asmName = new AssemblyName(args.Name);
                            if (asmName.Name.EndsWith(".resources", StringComparison.OrdinalIgnoreCase))
                            {
                                return ResolveSatelliteAssembly(asmName.Name, asmName.CultureName, path => AssemblyLoadContext.Default.LoadFromAssemblyPath(path));
                            }
                            return null;
                        };
                    }
                    catch
                    {
                    }
                }

                private static Assembly ResolveSatelliteAssembly(string name, string culture, Func<string, Assembly> loader)
                {
                    if (string.IsNullOrEmpty(culture)) return null;

                    string baseDir = AppDomain.CurrentDomain.BaseDirectory;
                    string[] cultureCandidates = new string[]
                    {
                        culture,
                        culture.Equals("zh-TW", StringComparison.OrdinalIgnoreCase) ? "zh-Hant" : culture,
                        culture.Equals("zh-Hant", StringComparison.OrdinalIgnoreCase) ? "zh-TW" : culture,
                        culture.Equals("zh-CN", StringComparison.OrdinalIgnoreCase) ? "zh-Hans" : culture,
                        culture.Equals("zh-Hans", StringComparison.OrdinalIgnoreCase) ? "zh-CN" : culture
                    };

                    foreach (var c in cultureCandidates)
                    {
                        string targetPath = Path.Combine(baseDir, "Lang", c, name + ".dll");
                        if (File.Exists(targetPath))
                        {
                            try
                            {
                                return loader(Path.GetFullPath(targetPath));
                            }
                            catch
                            {
                            }
                        }
                    }
                    return null;
                }
            }
        }
        '@ | Out-File -FilePath $resolverPath -Encoding utf8

        # 確保 csproj 包含編譯項目（相容舊版 XML 格式 csproj）
        [xml]$projXml = Get-Content $proj.FullName
        if ($projXml.Project.ItemGroup) {
            $hasCompile = Get-Content $proj.FullName | Select-String "LangResolver.cs"
            if (-not $hasCompile) {
                Write-Host "Adding LangResolver.cs reference to csproj..."
                $itemGroup = $projXml.CreateElement("ItemGroup", $projXml.Project.NamespaceURI)
                $compile = $projXml.CreateElement("Compile", $projXml.Project.NamespaceURI)
                $compile.SetAttribute("Include", "LangResolver.cs")
                $itemGroup.AppendChild($compile) | Out-Null
                $projXml.Project.AppendChild($itemGroup) | Out-Null
                $projXml.Save($proj.FullName)
            }
        }

    - name: Restore NuGet Packages
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        if ($sln) {
            Write-Host "Restoring solution via NuGet: $($sln.FullName)"
            nuget restore $sln.FullName
        } else {
            nuget restore
        }

    - name: Build Solution with MSBuild (x64)
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        if ($sln) {
            Write-Host "Building solution: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform="x64"
        } else {
            $proj = Get-ChildItem -Recurse -Filter DS4WinWPF.csproj | Select-Object -First 1
            msbuild $proj.FullName /p:Configuration=Release /p:Platform="x64"
        }

    - name: Collect Output Files and Enforce Lang Directory
      run: |
        if (Test-Path ./publish) { Remove-Item ./publish -Recurse -Force }
        New-Item -ItemType Directory -Force -Path ./publish/Lang | Out-Null

        $exe = Get-ChildItem -Recurse -Filter "DS4Windows.exe" | Where-Object { $_.FullName -like "*bin*Release*" -or $_.FullName -like "*bin*x64*" } | Select-Object -First 1
        if (-not $exe) {
            Write-Error "DS4Windows.exe not found after build!"
            exit 1
        }
        $dir = $exe.DirectoryName
        Write-Host "Found build output at: $dir"

        robocopy "$dir" ./publish /E /NJH /NJS /NDL /NC /NS
        if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 }

        # 將所有語系資料夾移動至 publish/Lang/
        $cultureDirs = Get-ChildItem -Path ./publish -Directory | Where-Object {
            $_.Name -ne "Lang" -and (
                (Get-ChildItem -Path $_.FullName -Filter "*.resources.dll" -Recurse).Count -gt 0 -or
                $_.Name -match "^[a-zA-Z]{2,3}(-[a-zA-Z]{2,4})?$"
            )
        }

        foreach ($cDir in $cultureDirs) {
            $targetLangDir = "./publish/Lang/$($cDir.Name)"
            if (-not (Test-Path $targetLangDir)) {
                New-Item -ItemType Directory -Force -Path $targetLangDir | Out-Null
            }
            Copy-Item -Path "$($cDir.FullName)\*" -Destination $targetLangDir -Recurse -Force
            Remove-Item -Path $cDir.FullName -Recurse -Force
        }

        # 建立雙向別名，確保雙重保險
        if (Test-Path ./publish/Lang/zh-TW) { Copy-Item -Path ./publish/Lang/zh-TW -Destination ./publish/Lang/zh-Hant -Recurse -Force }
        if (Test-Path ./publish/Lang/zh-Hant) { Copy-Item -Path ./publish/Lang/zh-Hant -Destination ./publish/Lang/zh-TW -Recurse -Force }
        if (Test-Path ./publish/Lang/zh-CN) { Copy-Item -Path ./publish/Lang/zh-CN -Destination ./publish/Lang/zh-Hans -Recurse -Force }
        if (Test-Path ./publish/Lang/zh-Hans) { Copy-Item -Path ./publish/Lang/zh-Hans -Destination ./publish/Lang/zh-CN -Recurse -Force }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DS4Windows-x64-Release
        path: ./publish/