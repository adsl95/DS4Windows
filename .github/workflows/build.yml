name: Build DS4Windows (.NET 8)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        if ($sln) {
            Write-Host "Restoring solution via NuGet: $($sln.FullName)"
            nuget restore $sln.FullName
        } else {
            nuget restore
        }

    - name: Build Solution with MSBuild (x64)
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        if ($sln) {
            Write-Host "Building solution: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform="x64"
        } else {
            $proj = Get-ChildItem -Recurse -Filter DS4WinWPF.csproj | Select-Object -First 1
            msbuild $proj.FullName /p:Configuration=Release /p:Platform="x64"
        }

    - name: Collect Output Files into Lang Directory (with .NET 8 Locale Compatibility)
      run: |
        # 1. 清理與建立 publish/Lang 目錄
        if (Test-Path ./publish) { Remove-Item ./publish -Recurse -Force }
        New-Item -ItemType Directory -Force -Path ./publish/Lang | Out-Null

        # 2. 尋找 DS4Windows.exe 的編譯輸出目錄
        $exe = Get-ChildItem -Recurse -Filter "DS4Windows.exe" | Where-Object { $_.FullName -like "*bin*Release*" -or $_.FullName -like "*bin*x64*" } | Select-Object -First 1
        if (-not $exe) {
            Write-Error "DS4Windows.exe not found after build!"
            exit 1
        }
        $dir = $exe.DirectoryName
        Write-Host "Found build output at: $dir"

        # 3. 複製主程式與相依庫到 publish 根目錄（排除語系資料夾）
        robocopy "$dir" ./publish /E /XD zh* ja* de* es* fr* ru* /NJH /NJS /NDL /NC /NS | Out-Null

        # 4. 尋找所有語系資料夾並複製到 publish/Lang/
        $cultureDirs = Get-ChildItem -Path "$dir" -Directory | Where-Object {
            (Get-ChildItem -Path $_.FullName -Filter "*.resources.dll" -Recurse).Count -gt 0
        }

        foreach ($cDir in $cultureDirs) {
            Write-Host "Syncing culture directory '$($cDir.Name)' into ./publish/Lang/"
            $targetDir = "./publish/Lang/$($cDir.Name)"
            Copy-Item -Path "$($cDir.FullName)" -Destination "./publish/Lang/" -Recurse -Force

            # 5. 【核心修復】補全 .NET 8 語系名稱相容性（雙向別名複製）
            if ($cDir.Name -ieq "zh-TW") {
                Write-Host "Creating .NET 8 alias: ./publish/Lang/zh-Hant"
                Copy-Item -Path "$($cDir.FullName)" -Destination "./publish/Lang/zh-Hant" -Recurse -Force
            } elseif ($cDir.Name -ieq "zh-CN") {
                Write-Host "Creating .NET 8 alias: ./publish/Lang/zh-Hans"
                Copy-Item -Path "$($cDir.FullName)" -Destination "./publish/Lang/zh-Hans" -Recurse -Force
            }
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DS4Windows-x64-Release
        path: ./publish/