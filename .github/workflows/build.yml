name: Build DS4Windows (.NET 8)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        if ($sln) {
            Write-Host "Restoring solution via NuGet: $($sln.FullName)"
            nuget restore $sln.FullName
        } else {
            nuget restore
        }

    - name: Build Solution with MSBuild (x64)
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        if ($sln) {
            Write-Host "Building solution: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform="x64"
        } else {
            $proj = Get-ChildItem -Recurse -Filter DS4WinWPF.csproj | Select-Object -First 1
            msbuild $proj.FullName /p:Configuration=Release /p:Platform="x64"
        }

    - name: Collect Output Files and Enforce Lang Directory
      run: |
        # 1. 清理與建立 publish 資料夾
        if (Test-Path ./publish) { Remove-Item ./publish -Recurse -Force }
        New-Item -ItemType Directory -Force -Path ./publish | Out-Null

        # 2. 尋找 DS4Windows.exe 的編譯輸出目錄
        $exe = Get-ChildItem -Recurse -Filter "DS4Windows.exe" | Where-Object { $_.FullName -like "*bin*Release*" -or $_.FullName -like "*bin*x64*" } | Select-Object -First 1
        if (-not $exe) {
            Write-Error "DS4Windows.exe not found after build!"
            exit 1
        }
        $dir = $exe.DirectoryName
        Write-Host "Found build output at: $dir"

        # 3. 將編譯輸出檔案完整複製至 publish
        robocopy "$dir" ./publish /E /NJH /NJS /NDL /NC /NS | Out-Null

        # 4. 建立 ./publish/Lang 資料夾
        $langPath = "./publish/Lang"
        if (-not (Test-Path $langPath)) {
            New-Item -ItemType Directory -Force -Path $langPath | Out-Null
        }

        # 5. 若專案源碼中含有 Lang 原始資料夾，同步至 publish/Lang
        $langSource = Get-ChildItem -Recurse -Directory | Where-Object { $_.Name -ieq "Lang" -and $_.FullName -notlike "*bin*" -and $_.FullName -notlike "*obj*" -and $_.FullName -notlike "*publish*" } | Select-Object -First 1
        if ($langSource) {
            Write-Host "Syncing source Lang folder from: $($langSource.FullName)"
            robocopy "$($langSource.FullName)" "$langPath" /E /NJH /NJS /NDL /NC /NS | Out-Null
        }

        # 6. 【核心修復】精確識別根目錄下的所有語系資料夾並「搬移」至 Lang/ 目錄，徹底清空根目錄殘留
        $cultureDirs = Get-ChildItem -Path ./publish -Directory | Where-Object { 
            $_.Name -ne "Lang" -and (
                (Get-ChildItem -Path $_.FullName -Filter "*.resources.dll" -Recurse).Count -gt 0 -or
                $_.Name -match "^[a-zA-Z]{2,3}(-[a-zA-Z]{2,4})?$"
            )
        }

        foreach ($cDir in $cultureDirs) {
            $destDir = Join-Path $langPath $cDir.Name
            Write-Host "Moving culture directory '$($cDir.Name)' from root into '$destDir'..."
            
            if (Test-Path $destDir) {
                Copy-Item -Path "$($cDir.FullName)\*" -Destination $destDir -Recurse -Force
                Remove-Item -Path $cDir.FullName -Recurse -Force
            } else {
                Move-Item -Path $cDir.FullName -Destination $destDir -Force
            }
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DS4Windows-x64-Release
        path: ./publish/